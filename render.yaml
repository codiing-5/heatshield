services:
  - type: web
    name: heatshield
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: FORTYGUARD_API_BASE_URL
        value: https://api.fortyguard.com/v1
